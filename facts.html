<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facts In Numbers</title>
    <link rel="stylesheet" href="factsstyle.css">
</head>

<body>

    <section class="facts">

        <div class="car-shape"></div>

        <div class="facts-content">

            <h1>Facts In Numbers</h1>

            <p class="intro">
                Amet cras hac orci lacus. Faucibus ipsum arcu lectus nibh sapien bibendum ullamcorper
                <br>
                in. Diam tincidunt tincidunt erat at semper fermentum
            </p>

            <div class="cards">

                <div class="card">
                    <div class="icon">🚗</div>

                    <div class="text">
                        <strong>540+</strong>
                        <span>Cars</span>
                    </div>
                </div>

                <div class="card">
                    <div class="icon">♙</div>

                    <div class="text">
                        <strong>20k+</strong>
                        <span>Customers</span>
                    </div>
                </div>

                <div class="card">
                    <div class="icon">▣</div>

                    <div class="text">
                        <strong>25+</strong>
                        <span>Years</span>
                    </div>
                </div>

                <div class="card">
                    <div class="icon">◉</div>

                    <div class="text">
                        <strong>20m+</strong>
                        <span>Miles</span>
                    </div>
                </div>

            </div>

        </div>

    </section>

</body>
</html>
