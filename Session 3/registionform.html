<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <link rel="stylesheet" href="registionstyle.css">
</head>

<body>

    <div class="container">

        <h1>Registion Form</h1>

        <form>

            <div class="row">

                <div class="field">
                    <label>First Name</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input type="text">
                </div>

            </div>

            <div class="field full">
                <label>Email Address</label>
                <input type="email">
            </div>

            <div class="field full">
                <label>Phone</label>
                <input type="tel">
            </div>

            <div class="row">

                <div class="field">
                    <label>City</label>

                    <select>
                        <option>London</option>
                    </select>
                </div>

                <div class="field">
                    <label>Country</label>

                    <select>
                        <option>India</option>
                    </select>
                </div>

            </div>

            <button type="submit">
                Get Started
            </button>

        </form>

    </div>

</body>
</html>
